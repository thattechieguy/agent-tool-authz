id: S14
title: Node header mismatch
category: caller-context
owasp: [LLM06]
description: node_id in token and request metadata must match.
steps:
  - id: s1
    node: waiver-node
    identity: { user: alice, scopes: [Loans.Waiver], caller_type: langgraph-node }
    context: { tainted: false }
    request:
      method: POST
      path: /loans/L-1001/late-fee-waivers
      body: { amount: 10 }
      headers:
        X-Agent-Node-Id: read-node
    approval: { bound_to: this }
    expect: { status: 403, error: invalid_caller_context }
assert_state:
  - { path: loans.L-1001.late_fee, op: eq, value: 150.0 }

