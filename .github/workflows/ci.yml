name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
      - run: make keys
      - run: make lint
      - run: make test
      - run: make demo-ci
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
      - run: make mypy

  apim-policy-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
      - run: make apim-scaffold
      - run: make apim-drift

  azure-poc-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - run: .venv/bin/python -m pytest tests/local -q
      - run: .venv/bin/python -c "from xml.etree import ElementTree; ElementTree.parse('apim/policy-reference.xml')"
